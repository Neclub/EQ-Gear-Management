<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EQGM changelog — recent EQ Gear Management releases by date.">
  <title>EQGM — Changelog</title>
  <link rel="icon" type="image/png" href="img/eqgm-icon.png">
  <link rel="apple-touch-icon" href="img/eqgm-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f1e;
      --panel: #141820;
      --panel-hover: #1a2030;
      --text: #d1d5dd;
      --muted: #8b93a7;
      --accent: #3b6fd4;
      --accent-hover: #4a82e8;
      --link: #8cb4ff;
      --border: #2a3140;
      --gold: #c9a84c;
      --gold-soft: rgba(201, 168, 76, 0.25);
      --accent-soft: rgba(59, 111, 212, 0.15);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.6 "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    a { color: var(--link); }
    a:hover { color: #a8c4ff; }
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      z-index: 100;
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      border-radius: 0 0 6px 0;
    }
    .skip-link:focus { left: 0; }
    .hero {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      background: #05050a;
      line-height: 0;
    }
    .hero img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: min(28vh, 280px);
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 40px;
      background: linear-gradient(to bottom, transparent, var(--bg));
      pointer-events: none;
    }
    .page {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 24px 48px;
    }
    .intro {
      text-align: center;
      padding: 28px 0 8px;
    }
    .intro-logo {
      display: block;
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
    }
    .intro h1 {
      margin: 0 0 12px;
      font-family: Cinzel, "Times New Roman", serif;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--gold);
    }
    .intro .tagline {
      margin: 0 auto 20px;
      max-width: 42em;
      font-size: 1.05rem;
      color: var(--muted);
    }
    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      align-items: center;
    }
    .text-link {
      font-size: 0.95rem;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .text-link:hover { color: var(--link); }
    .empty-msg, .status-msg {
      margin: 32px 0;
      text-align: center;
      color: var(--muted);
    }
    .day-block {
      margin-top: 36px;
    }
    .day-block h2 {
      margin: 0 0 16px;
      font-family: Cinzel, "Times New Roman", serif;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--gold);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .release {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 0 0 1px var(--gold-soft);
      padding: 16px 20px 18px;
      margin-bottom: 14px;
    }
    .release h3 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }
    .release h3 a {
      color: var(--text);
      text-decoration: none;
    }
    .release h3 a:hover { color: var(--gold); }
    .kind {
      margin: 12px 0 4px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .release ul {
      margin: 0;
      padding: 0 0 0 1.2em;
    }
    .release li {
      margin: 6px 0;
    }
    .release code {
      font-size: 0.9em;
      background: #0b1220;
      padding: 0 4px;
      border-radius: 3px;
    }
    footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
    }
    footer a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    footer a:hover { color: var(--link); }
    footer .footer-links { margin-bottom: 8px; }
    footer .footer-links a + a::before {
      content: "·";
      margin: 0 10px;
      color: var(--border);
      text-decoration: none;
    }
    @media (max-width: 600px) {
      .page { padding: 0 16px 40px; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="hero">
    <img src="img/eqgm-banner.png" alt="EQGM — EQ Gear Management" width="1920" height="640">
  </div>
  <div class="page">
    <header class="intro">
      <img class="intro-logo" src="img/eqgm-icon.png" alt="" width="96" height="96">
      <h1>Changelog</h1>
      <p class="tagline" id="summary">
        Recent EQGM releases by date. Shows the last five days, or the last five releases if that is more.
      </p>
      <div class="cta-row">
        <a class="text-link" href="./">Back to EQGM</a>
        <a class="text-link" href="https://github.com/Neclub/EQ-Gear-Management/blob/main/CHANGELOG.md">Full changelog on GitHub</a>
      </div>
    </header>
    <main id="main">
      <p class="status-msg" id="status">Loading changelog…</p>
      <div id="log" hidden></div>
    </main>
    <footer>
      <p class="footer-links">
        <a href="./">Home</a>
        <a href="https://github.com/Neclub/EQ-Gear-Management/releases">Releases</a>
        <a href="https://github.com/Neclub/EQ-Gear-Management">GitHub</a>
        <a href="https://github.com/Neclub/EQ-Gear-Management/wiki">How to use</a>
      </p>
      <p>&copy; <span id="year"></span> EQGM · Apache License 2.0</p>
    </footer>
  </div>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const CHANGELOG_URL = "https://raw.githubusercontent.com/Neclub/EQ-Gear-Management/main/CHANGELOG.md";
    const WINDOW_DAYS = 5;
    const MIN_RELEASES = 5;

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function ymd(date) {
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
    }

    function addDays(stamp, days) {
      const parts = stamp.split("-").map(Number);
      const date = new Date(parts[0], parts[1] - 1, parts[2]);
      date.setDate(date.getDate() + days);
      return ymd(date);
    }

    function formatDate(stamp) {
      const parts = stamp.split("-").map(Number);
      return new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric",
      });
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatInline(text) {
      let html = escapeHtml(text);
      html = html.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" rel="noopener">$1</a>');
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      return html;
    }

    function parseChangelog(markdown) {
      const lines = markdown.replace(/\r\n/g, "\n").split("\n");
      const releases = [];
      let current = null;
      let kind = "";
      const header = /^## \[([^\]]+)\](?:\s*-\s*(\d{4}-\d{2}-\d{2}))?\s*$/;
      const section = /^###\s+(.+)\s*$/;
      for (const line of lines) {
        const head = header.exec(line);
        if (head) {
          if (current && current.date) releases.push(current);
          current = { version: head[1], date: head[2] || "", sections: [] };
          kind = "";
          continue;
        }
        if (!current) continue;
        const sec = section.exec(line);
        if (sec) {
          kind = sec[1].trim();
          current.sections.push({ kind, items: [] });
          continue;
        }
        if (line.startsWith("- ") && current.sections.length) {
          current.sections[current.sections.length - 1].items.push(line.slice(2).trim());
        }
      }
      if (current && current.date) releases.push(current);
      return releases;
    }

    function pickReleases(releases) {
      const cutoff = addDays(ymd(new Date()), -(WINDOW_DAYS - 1));
      const inWindow = releases.filter((rel) => rel.date >= cutoff);
      const lastN = releases.slice(0, MIN_RELEASES);
      return inWindow.length >= lastN.length ? inWindow : lastN;
    }

    function groupByDate(releases) {
      const groups = [];
      const index = {};
      releases.forEach((rel) => {
        if (!index[rel.date]) {
          index[rel.date] = { date: rel.date, releases: [] };
          groups.push(index[rel.date]);
        }
        index[rel.date].releases.push(rel);
      });
      return groups;
    }

    function render(releases, picked) {
      const log = document.getElementById("log");
      const status = document.getElementById("status");
      const summary = document.getElementById("summary");
      if (!picked.length) {
        status.textContent = "No dated releases found.";
        return;
      }
      const dates = picked.map((rel) => rel.date);
      const newest = dates[0];
      const oldest = dates[dates.length - 1];
      const inFiveDays = releases.filter((rel) => rel.date >= addDays(ymd(new Date()), -(WINDOW_DAYS - 1)));
      const usedDays = inFiveDays.length >= MIN_RELEASES;
      summary.textContent = usedDays
        ? "Releases from " + formatDate(oldest) + " through " + formatDate(newest) + "."
        : "The last " + picked.length + " releases (more than the last " + WINDOW_DAYS + " days).";
      log.innerHTML = groupByDate(picked).map((group) => {
        const cards = group.releases.map((rel) => {
          const blocks = rel.sections.filter((sec) => sec.items.length).map((sec) => {
            const items = sec.items.map((item) => "<li>" + formatInline(item) + "</li>").join("");
            return '<div class="kind">' + escapeHtml(sec.kind) + "</div><ul>" + items + "</ul>";
          }).join("");
          const href = "https://github.com/Neclub/EQ-Gear-Management/releases/tag/v" + encodeURIComponent(rel.version);
          return '<article class="release"><h3><a href="' + href + '">' + escapeHtml(rel.version) + "</a></h3>" + blocks + "</article>";
        }).join("");
        return '<section class="day-block"><h2>' + escapeHtml(formatDate(group.date)) + "</h2>" + cards + "</section>";
      }).join("");
      status.hidden = true;
      log.hidden = false;
    }

    fetch(CHANGELOG_URL)
      .then((res) => {
        if (!res.ok) throw new Error("Could not load changelog");
        return res.text();
      })
      .then((markdown) => {
        const releases = parseChangelog(markdown);
        render(releases, pickReleases(releases));
      })
      .catch(() => {
        document.getElementById("status").innerHTML =
          'Could not load the changelog. See the <a href="https://github.com/Neclub/EQ-Gear-Management/blob/main/CHANGELOG.md">full list on GitHub</a>.';
      });
  </script>
</body>
</html>
