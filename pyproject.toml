[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-parser"
dynamic = ["version"]
description = "EQ Gear Management (EQGM) — EverQuest multi-character inventory dumps to equipped-gear Excel and optional interactive HTML reports"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
eqgm = "inventory_parser.cli:main"
eqgm-gui = "inventory_parser.web_gui:main"
inventory-parser = "inventory_parser.cli:main"
inventory-parser-gui = "inventory_parser.web_gui:main"

[tool.setuptools.dynamic]
version = { attr = "inventory_parser.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inventory_parser = ["data/*.json", "data/*.html", "data/gui/**", "data/weights/**", "assets/*"]
"inventory_parser.data" = ["*.json", "*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
