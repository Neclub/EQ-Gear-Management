<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EQ Class Icon Sets — Preview</title>
<style>
  :root {
    --bg: #0b0e11;
    --panel: #141820;
    --text: #eef0f4;
    --muted: #8b93a7;
    --recessed: #12151a;
    --border: #2a3140;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 32px 40px;
  }
  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
  .subtitle { color: var(--muted); margin-bottom: 28px; font-size: 13px; }
  .sets { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 1100px) { .sets { grid-template-columns: 1fr; } }
  .set-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .set-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .set-header span { color: var(--muted); font-weight: 400; font-size: 11px; }
  .archetype {
    padding: 10px 14px 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .roster {
    padding: 2px 6px 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
  }
  .char-card {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    border-radius: 8px;
  }
  .char-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 1.5px solid var(--class-color);
    background: radial-gradient(circle at 30% 25%, var(--class-bg), var(--recessed));
    box-shadow: 0 0 8px var(--class-glow);
  }
  .char-icon svg { width: 14px; height: 14px; color: var(--class-color); }
  .char-name { font-weight: 600; font-size: 12px; }
  .class-badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--class-color);
    background: var(--class-bg);
    border: 1px solid color-mix(in srgb, var(--class-color) 35%, transparent);
    margin-left: 6px;
  }
  .char-row { display: flex; align-items: center; }
</style>
</head>
<body>
<h1>EverQuest Class Icons — 4 Sets</h1>
<p class="subtitle">16 classes from the EQ archetype guide. Sized for the Team Characters roster (28px circle, 14px icon). Open this file in a browser to compare sets side by side.</p>

<div id="sprite-host" hidden></div>
<div class="sets" id="sets"></div>

<script>
const THEMES = {
  WAR: { color: "#dc2626", bg: "rgba(220, 38, 38, 0.14)", glow: "rgba(220, 38, 38, 0.25)", icon: "class-war" },
  PAL: { color: "#facc15", bg: "rgba(250, 204, 21, 0.14)", glow: "rgba(250, 204, 21, 0.25)", icon: "class-pal" },
  SHD: { color: "#9333ea", bg: "rgba(147, 51, 234, 0.14)", glow: "rgba(147, 51, 234, 0.25)", icon: "class-shd" },
  MNK: { color: "#f59e0b", bg: "rgba(245, 158, 11, 0.14)", glow: "rgba(245, 158, 11, 0.25)", icon: "class-mnk" },
  ROG: { color: "#94a3b8", bg: "rgba(148, 163, 184, 0.14)", glow: "rgba(148, 163, 184, 0.25)", icon: "class-rog" },
  BER: { color: "#f97316", bg: "rgba(249, 115, 22, 0.14)", glow: "rgba(249, 115, 22, 0.25)", icon: "class-ber" },
  RNG: { color: "#65a30d", bg: "rgba(101, 163, 13, 0.14)", glow: "rgba(101, 163, 13, 0.25)", icon: "class-rng" },
  BST: { color: "#84cc16", bg: "rgba(132, 204, 22, 0.14)", glow: "rgba(132, 204, 22, 0.25)", icon: "class-bst" },
  ENC: { color: "#ec4899", bg: "rgba(236, 72, 153, 0.14)", glow: "rgba(236, 72, 153, 0.25)", icon: "class-enc" },
  WIZ: { color: "#3b82f6", bg: "rgba(59, 130, 246, 0.14)", glow: "rgba(59, 130, 246, 0.25)", icon: "class-wiz" },
  MAG: { color: "#ef4444", bg: "rgba(239, 68, 68, 0.14)", glow: "rgba(239, 68, 68, 0.25)", icon: "class-mag" },
  NEC: { color: "#a855f7", bg: "rgba(168, 85, 247, 0.14)", glow: "rgba(168, 85, 247, 0.25)", icon: "class-nec" },
  BRD: { color: "#eab308", bg: "rgba(234, 179, 8, 0.14)", glow: "rgba(234, 179, 8, 0.25)", icon: "class-brd" },
  CLR: { color: "#22c55e", bg: "rgba(34, 197, 94, 0.14)", glow: "rgba(34, 197, 94, 0.25)", icon: "class-clr" },
  SHM: { color: "#06b6d4", bg: "rgba(6, 182, 212, 0.14)", glow: "rgba(6, 182, 212, 0.25)", icon: "class-shm" },
  DRU: { color: "#10b981", bg: "rgba(16, 185, 129, 0.14)", glow: "rgba(16, 185, 129, 0.25)", icon: "class-dru" },
};

const ARCHETYPES = [
  { label: "Tanks", classes: [
    ["WAR", "Warrior"], ["PAL", "Paladin"], ["SHD", "Shadow Knight"]
  ]},
  { label: "Melee & Hybrid DPS", classes: [
    ["MNK", "Monk"], ["ROG", "Rogue"], ["BER", "Berserker"], ["RNG", "Ranger"], ["BST", "Beastlord"]
  ]},
  { label: "Casters & Utility", classes: [
    ["ENC", "Enchanter"], ["WIZ", "Wizard"], ["MAG", "Magician"], ["NEC", "Necromancer"], ["BRD", "Bard"]
  ]},
  { label: "Priests & Healers", classes: [
    ["CLR", "Cleric"], ["SHM", "Shaman"], ["DRU", "Druid"]
  ]},
];

const SETS = [
  { id: "a", name: "Set A — Refined Stroke", file: "sprites-inline-a.svg", desc: "Clean line icons, 1.75px stroke" },
  { id: "b", name: "Set B — Solid Glyph", file: "sprites-inline-b.svg", desc: "Filled silhouettes, best at small sizes" },
  { id: "c", name: "Set C — Heraldic Crest", file: "sprites-inline-c.svg", desc: "Shield & circle medallions" },
  { id: "d", name: "Set D — Arcane Rune", file: "sprites-inline-d.svg", desc: "Angular geometric sigils" },
];

async function loadSprite(file) {
  const res = await fetch(file);
  const text = await res.text();
  document.getElementById("sprite-host").insertAdjacentHTML("beforeend", text);
}

function makeCard(abbr, name, setId) {
  const t = THEMES[abbr];
  const card = document.createElement("div");
  card.className = "char-card";
  const icon = document.createElement("div");
  icon.className = "char-icon";
  icon.style.setProperty("--class-color", t.color);
  icon.style.setProperty("--class-bg", t.bg);
  icon.style.setProperty("--class-glow", t.glow);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", "#s" + setId + "-" + t.icon);
  svg.appendChild(use);
  icon.appendChild(svg);
  const row = document.createElement("div");
  row.className = "char-row";
  const nm = document.createElement("span");
  nm.className = "char-name";
  nm.textContent = name;
  const badge = document.createElement("span");
  badge.className = "class-badge";
  badge.textContent = abbr;
  badge.style.setProperty("--class-color", t.color);
  badge.style.setProperty("--class-bg", t.bg);
  row.appendChild(nm);
  row.appendChild(badge);
  card.appendChild(icon);
  card.appendChild(row);
  return card;
}

async function init() {
  for (const set of SETS) await loadSprite(set.file);
  const root = document.getElementById("sets");
  for (const set of SETS) {
    const panel = document.createElement("div");
    panel.className = "set-panel";
    const hdr = document.createElement("div");
    hdr.className = "set-header";
    hdr.innerHTML = set.name + " <span>" + set.desc + "</span>";
    panel.appendChild(hdr);
    for (const arch of ARCHETYPES) {
      const lbl = document.createElement("div");
      lbl.className = "archetype";
      lbl.textContent = arch.label;
      panel.appendChild(lbl);
      const roster = document.createElement("div");
      roster.className = "roster";
      for (const [abbr, name] of arch.classes) {
        roster.appendChild(makeCard(abbr, name, set.id));
      }
      panel.appendChild(roster);
    }
    root.appendChild(panel);
  }
}
init();
</script>
</body>
</html>
