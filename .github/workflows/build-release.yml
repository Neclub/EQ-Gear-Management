name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -q -e .
          python -m pip install -q "pyinstaller>=6.0"

      - name: Build executable
        run: python scripts/run_pyinstaller.py

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python scripts/print_package_version.py)" >> "$GITHUB_OUTPUT"

      - name: Sign executable
        env:
          IP_SIGN_PFX_B64: ${{ secrets.IP_SIGN_PFX_B64 }}
          IP_SIGN_PASSWORD: ${{ secrets.IP_SIGN_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:IP_SIGN_PFX_B64)) {
            Write-Host "Skipping code signing (IP_SIGN_PFX_B64 secret is not set)"
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "eqgm-codesign.pfx"
          $b64 = ($env:IP_SIGN_PFX_B64 -replace '\s', '')
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($b64))
            $env:IP_SIGN_PFX = $pfxPath
            python scripts/sign_exe.py --require "dist/EQGM-${{ steps.version.outputs.version }}.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: EQ Gear Management ${{ steps.version.outputs.version }}
          files: dist/EQGM-${{ steps.version.outputs.version }}.exe
          generate_release_notes: true
          make_latest: true

      - name: Notify Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Skipping Discord notify (DISCORD_WEBHOOK_URL secret is not set)"
            exit 0
          fi
          version="${{ steps.version.outputs.version }}"
          repo="${{ github.repository }}"
          payload=$(printf '{"content":"**EQ Gear Management %s** released.\\nRelease: https://github.com/%s/releases/tag/v%s\\nDownload: https://github.com/%s/releases/latest/download/EQGM-%s.exe"}' \
            "$version" "$repo" "$version" "$repo" "$version")
          curl -fsS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
